[project]
name = "odysseus-raspberry-pi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexgiavaras", email = "alex.giavaras@trilodocs.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.52.3",
    "pyinfra>=3.10.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyserial>=3.5",
]

[project.optional-dependencies]
picamera = ["picamera2>=0.3.20"]

[project.scripts]
odysseus-raspberry-pi = "odysseus_raspberry_pi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
